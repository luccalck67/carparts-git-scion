name: Benchmark
on:
  pull_request:
    paths:
      - '.github/workflows/benchmark.yml'
      - 'apps/api/**'
      - 'libs/ui/**'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [full, slim]
        sample: [1, 2, 3]
    steps:
      - name: Inicio da medicao de checkout
        run: echo "CHECKOUT_START=$(date +%s%N)" >> "$GITHUB_ENV"
      - name: Checkout completo de referencia
        if: matrix.mode == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout enxuto
        if: matrix.mode == 'slim'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            apps/api
            libs/ui
          persist-credentials: false
      - name: Registrar duracao e tamanho
        env:
          MODE: ${{ matrix.mode }}
          SAMPLE: ${{ matrix.sample }}
        run: |
          export END_NS=$(date +%s%N)
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const record = {
            mode: process.env.MODE, sample: Number(process.env.SAMPLE),
            run_id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            sha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            checkout_ms: Number(BigInt(process.env.END_NS) - BigInt(process.env.CHECKOUT_START)) / 1e6,
            git_size: execFileSync('git', ['count-objects', '-vH'], { encoding: 'utf8' }),
            method: 'wall clock entre steps; inclui overhead do runner, nao apenas transferencia'
          };
          writeFileSync(`benchmark-${record.mode}-${record.sample}.json`, JSON.stringify(record, null, 2));
          console.log(JSON.stringify(record));
          JS
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
      - run: npm run test:api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.mode }}-${{ matrix.sample }}-${{ github.run_attempt }}
          path: benchmark-*.json
          retention-days: 30
