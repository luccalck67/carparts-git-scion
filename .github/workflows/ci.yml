name: CI
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Selecionar componentes por caminhos
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { selectComponents } from './scripts/ci-components.mjs';
          let files = [];
          if (process.env.EVENT_NAME === 'pull_request') {
            files = execFileSync('git', ['diff', '--name-only', `${process.env.BASE_SHA}...${process.env.HEAD_SHA}`], { encoding: 'utf8' }).trim().split('\n');
          }
          const selected = selectComponents(files, process.env.EVENT_NAME);
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: selected })}\n`);
          console.log(JSON.stringify(selected));
          JS
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verificar prompt, arquivos e historico
        run: node scripts/verify.mjs
      - name: Testar selecao por caminhos
        run: node --test scripts/ci-components.test.mjs
      - name: Reproduzir laboratorio Git completo em Ubuntu
        run: node scripts/git-lab.mjs
      - name: Verificar segredos com Gitleaks e checksum fixado
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .
      - name: Gerar changelog sem escrita na main
        run: node scripts/changelog.mjs > changelog.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            changelog.md
            evidencias/git/execucao.log
            evidencias/git/resultado.json
          retention-days: 14
  tests:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: ${{ matrix.paths }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:${{ matrix.component }}
  quality:
    if: always()
    needs: [changes, audit, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir conclusao de todos os checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const needs = JSON.parse(process.env.RESULTS); if (Object.values(needs).some(job => job.result !== "success")) process.exit(1); console.log("Checks obrigatorios aprovados");'
